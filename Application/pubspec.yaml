name: airsens
description: "A sensory system for detecting air quality."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_gauges: ^20.4.40
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  fpdart: ^1.1.1
  sqflite: ^2.4.1
  socket_io_client: ^3.0.2
  dio: ^5.7.0
  intl: ^0.19.0
  logger: ^2.5.0
  toggle_switch: ^2.3.0
  font_awesome_flutter: ^10.8.0
  shimmer: ^3.0.0
  syncfusion_flutter_sliders: ^20.4.54

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/font/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/font/Urbanist-VariableFont_wght.ttf
